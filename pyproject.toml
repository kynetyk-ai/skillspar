[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillspar"
version = "0.1.0"
description = "Declarative testing harness for Claude Code Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["claude", "anthropic", "testing", "skills", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
authors = [{ name = "Kynetyk Holdings LLC" }]
dependencies = [
    "anthropic>=0.39.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonpath-ng>=1.6.0",
    "click>=8.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "watchfiles>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/kynetyk-ai/skillspar"
Repository = "https://github.com/kynetyk-ai/skillspar"
"Bug Tracker" = "https://github.com/kynetyk-ai/skillspar/issues"

[project.scripts]
skillspar = "skill_evaluator.cli:main"
skill-eval = "skill_evaluator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_evaluator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]
