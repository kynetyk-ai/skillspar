# 01 — Single-turn tests with all output assertion types.
# Demonstrates: stop_reason, output_contains, output_not_contains, output_matches_regex.

suite: "greeting skill basics"
skill: "./sample-skill/SKILL.md"

defaults:
  model: "claude-sonnet-4-5-20250929"
  max_tokens: 4096
  temperature: 0

tests:
  - name: "responds to a simple greeting"
    type: single_turn
    input:
      messages:
        - role: user
          content: "Hello!"
    assertions:
      - type: stop_reason
        value: end_turn
      - type: output_matches_regex
        pattern: "(?i)hello|hi|hey"

  - name: "includes user name in greeting"
    type: single_turn
    input:
      messages:
        - role: user
          content: "Hi, I'm Alice!"
    assertions:
      - type: output_contains
        value: "Alice"

  - name: "does not include unsolicited offers to help"
    type: single_turn
    input:
      messages:
        - role: user
          content: "Hey there"
    assertions:
      - type: output_not_contains
        value: "How can I help"

  - name: "greets in three languages"
    type: single_turn
    input:
      messages:
        - role: user
          content: "Hello!"
    assertions:
      - type: output_matches_regex
        pattern: "(?i)hola"
      - type: output_matches_regex
        pattern: "こんにちは"
