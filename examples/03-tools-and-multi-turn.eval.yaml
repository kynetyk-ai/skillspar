# 03 — Tools, multi-turn loops, and all tool/turn assertions.
# Demonstrates: builtin tools, tool_called, tool_not_called, tool_args_match,
# tool_sequence, tool_called_times (exactly/min), turn_count (exactly/min/max),
# tool_responses (single/sequence/wildcard), conversation history with
# tool_calls/tool_result in single_turn.

suite: "file operations"
skill: "./sample-skill/SKILL.md"

defaults:
  model: "claude-sonnet-4-5-20250929"
  max_tokens: 4096
  temperature: 0

tools:
  - builtin: Read
  - builtin: Write

tests:
  # --- Single-turn: tool_called + tool_args_match ---
  - name: "creates a file when asked"
    type: single_turn
    input:
      messages:
        - role: user
          content: "Create a file called hello.txt with the content 'Hello World'"
    assertions:
      - type: tool_called
        tool: Write
      - type: tool_args_match
        tool: Write
        path: "$.file_path"
        pattern: "hello\\.txt$"

  # --- Single-turn: tool_not_called ---
  - name: "does not read for a simple write"
    type: single_turn
    input:
      messages:
        - role: user
          content: "Write 'hello' to /tmp/out.txt"
    assertions:
      - type: tool_not_called
        tool: Read

  # --- Single-turn with conversation history (tool_calls/tool_result) ---
  - name: "continues from prior tool context"
    type: single_turn
    input:
      messages:
        - role: user
          content: "Create a greeting file"
        - role: assistant
          content: "I'll create that for you."
          tool_calls:
            - id: "tc_001"
              name: Write
              input:
                file_path: "/project/greeting.txt"
                content: "Hello!"
        - role: tool_result
          tool_use_id: "tc_001"
          content: "File written successfully"
        - role: user
          content: "Now add a goodbye message to it"
    assertions:
      - type: tool_called
        tool: Write

  # --- Multi-turn: tool_sequence + tool_called_times (exactly) ---
  - name: "reads then writes a modified file"
    type: multi_turn
    max_turns: 5
    input:
      messages:
        - role: user
          content: "Read hello.txt and add a timestamp to it"
    tool_responses:
      - match:
          tool: Read
        response:
          content: "Hello World"
      - match:
          tool: Write
        response:
          content: "File written successfully"
      - match: "*"
        response:
          content: "OK"
    assertions:
      - type: tool_sequence
        tools: [Read, Write]
      - type: tool_called_times
        tool: Read
        exactly: 1
      - type: tool_called_times
        tool: Write
        exactly: 1

  # --- Multi-turn: response sequences + tool_called_times (min) ---
  - name: "polls until ready then writes"
    type: multi_turn
    max_turns: 8
    input:
      messages:
        - role: user
          content: "Check the status file /status.txt until it says 'ready', then write 'done' to /result.txt"
    tool_responses:
      - match:
          tool: Read
        responses:
          - content: "pending"
          - content: "pending"
          - content: "ready"
      - match:
          tool: Write
        response:
          content: "File written successfully"
      - match: "*"
        response:
          content: "OK"
    assertions:
      - type: tool_called
        tool: Read
      - type: tool_called_times
        tool: Read
        min: 3
      - type: tool_called
        tool: Write

  # --- Multi-turn: turn_count (exactly) ---
  # A single tool call takes 2 turns: (1) model calls Write, (2) model confirms.
  - name: "completes single-step task in two turns"
    type: multi_turn
    max_turns: 5
    input:
      messages:
        - role: user
          content: "Write the word 'test' to /tmp/test.txt"
    tool_responses:
      - match:
          tool: Write
        response:
          content: "File written successfully"
      - match: "*"
        response:
          content: "OK"
    assertions:
      - type: tool_called
        tool: Write
      - type: turn_count
        exactly: 2

  # --- Multi-turn: turn_count (min/max) ---
  - name: "completes read-modify-write within budget"
    type: multi_turn
    max_turns: 5
    input:
      messages:
        - role: user
          content: "Read config.json, update the version to 2.0, and write it back"
    tool_responses:
      - match:
          tool: Read
        response:
          content: '{"version": "1.0", "name": "app"}'
      - match:
          tool: Write
        response:
          content: "File written successfully"
      - match: "*"
        response:
          content: "OK"
    assertions:
      - type: tool_sequence
        tools: [Read, Write]
      - type: turn_count
        min: 1
        max: 3
