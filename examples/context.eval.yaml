# Context injection example — demonstrates how reference files are injected
# into the conversation before the test input, simulating that Claude has
# already read them.

suite: "context injection demo"
skill: "./sample-skill/SKILL.md"

# Suite-level context: injected into ALL tests
context:
  - file: "./sample-ref.py"

tests:
  # The model receives sample-ref.py as a synthetic Read tool result
  # before seeing the user message, so it can reference the code.
  - name: "can reference the greet function"
    type: single_turn
    input:
      messages:
        - role: user
          content: "What does the greet function do?"
    assertions:
      - type: output_contains
        value: "Hello"

  # Test-level context adds files on top of suite context.
  - name: "with additional test context"
    type: single_turn
    context:
      - file: "./sample-ref.py"
        lines: [5, 7]
    input:
      messages:
        - role: user
          content: "Explain just the greet function"
    assertions:
      - type: output_matches_regex
        pattern: "(?i)greet|greeting"
