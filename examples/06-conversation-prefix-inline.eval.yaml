# 06 — Inline conversation prefix with skill_position: top and caching.
# Demonstrates: conversation_prefix.messages, skill_position: top,
# enable_caching: true, baseline: true with prefix dilution.

suite: "mid-conversation skill retention (inline)"
skill: "./sample-skill/SKILL.md"

defaults:
  model: "claude-sonnet-4-5-20250929"
  max_tokens: 4096
  temperature: 0
  enable_caching: true

conversation_prefix:
  skill_position: top
  messages:
    - role: user
      content: "Can you help me refactor this Python function to use list comprehension?"
    - role: assistant
      content: >
        Sure! List comprehensions are a concise way to create lists. Instead of
        using a for-loop with append, you can write the expression inline.
        Could you share the function you'd like to refactor?
    - role: user
      content: |
        Here it is:
        def get_even_numbers(nums):
            result = []
            for n in nums:
                if n % 2 == 0:
                    result.append(n)
            return result
    - role: assistant
      content: |
        Here's the refactored version using a list comprehension:

        ```python
        def get_even_numbers(nums):
            return [n for n in nums if n % 2 == 0]
        ```

        This is more Pythonic and easier to read for simple filtering operations.
    - role: user
      content: "Great, that looks clean. Now can you also add type hints?"
    - role: assistant
      content: |
        Of course! Here's the version with type hints:

        ```python
        def get_even_numbers(nums: list[int]) -> list[int]:
            return [n for n in nums if n % 2 == 0]
        ```

        The `list[int]` annotations make it clear what types the function expects
        and returns.

tests:
  - name: "skill activates after prior context"
    type: single_turn
    baseline: true
    input:
      messages:
        - role: user
          content: "Hey, I'm Bob!"
    assertions:
      - type: stop_reason
        value: end_turn
      - type: output_contains
        value: "Bob"

  - name: "response quality survives context dilution"
    type: single_turn
    baseline: true
    input:
      messages:
        - role: user
          content: "Hello there, how are you?"
    assertions:
      - type: stop_reason
        value: end_turn
      - type: llm_judge
        criteria: >
          The response should be a multilingual greeting in exactly three
          languages (English, Spanish, Japanese), one per line, with no extra
          text or follow-up questions. It should NOT reference or continue
          the coding conversation about list comprehensions or type hints.
