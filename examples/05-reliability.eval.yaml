# 05 — Repeated runs, baselines, and pass thresholds.
# Demonstrates: defaults.runs, defaults.pass_threshold, defaults.max_retries,
# defaults.concurrency, per-test runs/pass_threshold overrides,
# temperature > 0 for variability, baseline: true.

suite: "greeting skill reliability"
skill: "./sample-skill/SKILL.md"

defaults:
  model: "claude-sonnet-4-5-20250929"
  max_tokens: 4096
  temperature: 0.7
  runs: 5
  pass_threshold: 0.8
  max_retries: 2
  concurrency: 4

tests:
  - name: "greets with name reliably"
    type: single_turn
    baseline: true
    input:
      messages:
        - role: user
          content: "Hi, I'm Alice!"
    assertions:
      - type: output_contains
        value: "Alice"

  - name: "always finishes without error"
    type: single_turn
    runs: 10
    pass_threshold: 1.0
    input:
      messages:
        - role: user
          content: "Hello!"
    assertions:
      - type: stop_reason
        value: end_turn

  - name: "produces multilingual output"
    type: single_turn
    input:
      messages:
        - role: user
          content: "Hey there"
    assertions:
      - type: output_contains
        value: "Hola"
      - type: output_matches_regex
        pattern: "こんにちは"
