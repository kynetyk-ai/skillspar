# Basic eval suite demonstrating the test definition format.
# This tests a simple greeting skill.

suite: "greeting skill basics"
skill: "./sample-skill/SKILL.md"

defaults:
  model: "claude-sonnet-4-5-20250929"
  max_tokens: 4096
  temperature: 0

tests:
  # --- Single-turn: basic greeting ---
  - name: "responds to a simple greeting"
    type: single_turn
    input:
      messages:
        - role: user
          content: "Hello!"
    assertions:
      - type: stop_reason
        value: end_turn
      - type: output_matches_regex
        pattern: "(?i)hello|hi|hey"

  # --- Single-turn: uses the user's name ---
  - name: "includes user name in greeting"
    type: single_turn
    input:
      messages:
        - role: user
          content: "Hi, I'm Alice!"
    assertions:
      - type: output_contains
        value: "Alice"

  # --- Single-turn: offers help ---
  - name: "offers to help"
    type: single_turn
    input:
      messages:
        - role: user
          content: "Hey there"
    assertions:
      - type: output_matches_regex
        pattern: "(?i)help|assist"

  # --- Single-turn: does not call tools for a simple greeting ---
  - name: "does not use tools for greeting"
    type: single_turn
    input:
      messages:
        - role: user
          content: "Hello!"
    assertions:
      - type: tool_not_called
        tool: Write
      - type: tool_not_called
        tool: Read
